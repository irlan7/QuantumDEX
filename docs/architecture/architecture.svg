<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>QuantumDEX high-level system architecture</title>
<desc>User wallet connects to the QuantumDEX frontend, which talks to the backend trading engine. The backend routes AI-driven trading through AetraAI, and blockchain operations through a Chain Adapter Layer that supports BNB Chain, XRP Ledger, Ethereum, and Arbitrum.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57534e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="520" fill="#ffffff"/>

<!-- User / Wallet -->
<rect x="270" y="20" width="140" height="44" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#292524">User wallet</text>
<line x1="340" y1="64" x2="340" y2="100" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Frontend -->
<rect x="220" y="100" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">QuantumDEX frontend</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Web app, self-custodial signing</text>
<line x1="340" y1="156" x2="340" y2="192" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Backend -->
<rect x="190" y="192" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Backend trading engine</text>
<text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Matching, risk, price oracle</text>

<line x1="270" y1="248" x2="200" y2="284" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="248" x2="480" y2="284" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- AetraAI -->
<rect x="60" y="284" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text x="200" y="304" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">AetraAI agentic engine</text>
<text x="200" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">RSI/EMA strategy execution</text>

<!-- Chain Adapter Layer -->
<rect x="360" y="284" width="260" height="56" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="490" y="304" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Chain adapter layer</text>
<text x="490" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Unified multi-chain interface</text>

<line x1="490" y1="340" x2="490" y2="376" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 4 chain boxes -->
<rect x="60" y="376" width="130" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="125" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">BNB Chain</text>
<text x="125" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Mainnet</text>

<rect x="205" y="376" width="130" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="270" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">XRP Ledger</text>
<text x="270" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Mainnet, read</text>

<rect x="350" y="376" width="130" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="415" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Ethereum</text>
<text x="415" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Sepolia testnet</text>

<rect x="495" y="376" width="125" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="557" y="396" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Arbitrum</text>
<text x="557" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Sepolia testnet</text>

<line x1="125" y1="428" x2="125" y2="460" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="428" x2="270" y2="460" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="415" y1="428" x2="415" y2="460" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="557" y1="428" x2="557" y2="460" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- QuantumVault -->
<rect x="60" y="460" width="560" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="482" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">QuantumVault — self-custodial smart contract</text>
</svg>
